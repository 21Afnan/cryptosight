# ==============================================================================
# PREPROCESSING CONFIGURATION (`pp.config.yaml`)
# ==============================================================================
# Easily switch any preprocessing technique without modifying your Python code.
# ==============================================================================

enabled: true

# Select ONE method to apply to all features:
# Options: 
#   none | robust | minmax | fracdiff | winsorize | log | gaussian
method: "robust"

# Parameters for methods that need custom settings:
parameters:
  frac_d: 0.35          # For 'fracdiff': degree of differencing (0.0 to 1.0)
  winsor_limits: 0.01   # For 'winsorize': clip top/bottom 1% outliers

# Do NOT scale these columns (keep them original):
exclude_columns:
  - "timestamp"
  - "target"

# ==============================================================================
# MACHINE LEARNING EVALUATION CONFIGURATION
# ==============================================================================
# Select models to evaluate (`xgboost`, `lightgbm`, or both as a list):
models:
  - "xgboost"
  - "lightgbm"

# Select preprocessing techniques to loop across and compare in benchmark table:
methods_to_test:
  - "none"       # Baseline (No preprocessing)
  - "robust"     # 1. RobustScaler (Median/IQR based, outlier-proof)
  - "minmax"     # 3. MinMaxScaler (Bounded transform for LSTM/GRU)
  - "fracdiff"   # 4. Fractional Differencing (Stationary + memory preserved)
  - "winsorize"  # 6. Winsorize (Outlier clipping 1st/99th percentile on train split)
  - "log"        # 7. Log Transform (Sign-preserving math transform, zero leakage)
  - "gaussian"   # 8. Gaussian Quantile Transform (Taming fat tails, fit on train)


