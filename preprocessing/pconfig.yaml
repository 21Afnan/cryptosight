enabled: true

# Select ONE method to apply to all features when running single transformation:
# Options: 
#   none | robust | minmax | fracdiff | winsorize | log | gaussian
method: "robust"

# Parameters for methods that need custom settings:
parameters:
  frac_d: 0.35          # For 'fracdiff': degree of differencing (0.0 to 1.0)
  winsor_limits: 0.01   # For 'winsorize': clip top/bottom 1% outliers

# Do NOT scale these columns (keep them original):
exclude_columns:
  - "timestamp"
  - "target"

model_task: "regression"

# Select models to evaluate based on model_task:
models:
  - lightgbm
  - xgboost
  - linear_regression

# Select preprocessing techniques to loop across and compare in benchmark table:
methods_to_test:
  - "none"       # Baseline (No preprocessing)
  - "robust"     # 1. RobustScaler (Median/IQR based, outlier-proof)
  - "minmax"     # 3. MinMaxScaler (Bounded transform for LSTM/GRU)
  - "fracdiff"   # 4. Fractional Differencing (Stationary + memory preserved)
  - "winsorize"  # 6. Winsorize (Outlier clipping 1st/99th percentile on train split)
  - "log"        # 7. Log Transform (Sign-preserving math transform, zero leakage)
  - "gaussian"   # 8. Gaussian Quantile Transform (Taming fat tails, fit on train)

# Optional Advanced Quantitative Analysis Flags (`PDF Step 4 & Step 5`):
run_stationarity_analysis: true   # Set to true to run ADF, KPSS, and Autocorrelation analysis
run_trend_analysis: true          # Set to true to run Macro & Local Trend Preservation analysis

# ==============================================================================
# OUTPUT & CSV STORAGE DIRECTORIES (`csv_files/`)
# Automatically divides exports into 3 subfolders under classification/regression
# ==============================================================================
output_dirs:
  root: "../csv_files"
  subfolders:
    preprocess: "preprocessed_data"            # Subfolder 1: Preprocessed datasets
    predicted_signals: "model_predicted"       # Subfolder 2: Model predictions & signals (+1, 0, -1)
    backtest_ledgers: "backtest_ledgers"       # Subfolder 3: Backtest trade ledgers & summaries
