# ==============================================================================
# CRYPTOSIGHT — INFERENCE ENGINE CONFIGURATION
# ==============================================================================
# This file fully controls the inference pipeline.
# Exchange comes first, then data settings, then model selection, then features.
# ==============================================================================

inference:

  # --- 1. EXCHANGE & DATA SOURCE ---
  exchange: "binance"
  symbols:
    - "BTC"
  timeframe: "1m"              # Base raw timeframe to fetch from exchange
  target_timeframe: "15m"      # Resampled timeframe matching the trained model

  # --- 2. DATE RANGE TO INFER ON ---
  start_date: "2026-07-01 00:00:00"
  end_date: "2026-07-16 00:00:00"

  # --- 3. MODEL SELECTION ---
  model_type: "classification"   # Options: 'classification' or 'regression'
  models:
    - "xgboost"
    - "random_forest"
    - "lightgbm"

  # --- 4. FEATURE ENGINEERING ---
  # Must exactly mirror the features used during training
  features:
    enabled: true
    indicators:
      EMA:
        - parameters:
            timeperiod: 20
          aliases:
            ema: ind_EMA_20
        - parameters:
            timeperiod: 50
          aliases:
            ema: ind_EMA_50
      RSI:
        - parameters:
            timeperiod: 14
          aliases:
            rsi: ind_RSI_14
      MACD:
        - parameters:
            fastperiod: 12
            slowperiod: 26
            signalperiod: 9
          aliases:
            macd: ind_MACD_12_26_9
            signal: ind_MACD_SIGNAL_12_26_9
            histogram: ind_MACD_HIST_12_26_9

    patterns:
      DOJI:
        aliases:
          pattern: pat_DOJI
      BULLISH_ENGULFING:
        aliases:
          pattern: pat_BULLISH_ENGULFING

  # --- 5. TARGET GENERATION (for Actual vs Predicted evaluation only) ---
  target:
    source: close
    horizon: 1
    threshold: 0.002
