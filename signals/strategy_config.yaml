# ==========================================
# MULTI-STRATEGY CONFIGURATION (BYBIT EXCLUSIVE)
# Contains 20 unique strategy definitions with calibrated TP (1.0%-1.5%) & SL (0.5%-0.8%)
# ==========================================

strategies:
  # 1. BTC 1h RSI Mean Reversion
  - strategy_name: "BTC 1h RSI Mean Reversion"
    market:
      exchange: "bybit"
      symbol: "BTC"
      timeframe: "1m"
      target_timeframe: "1h"
      start_time: "2026-07-19 00:00:00"
      end_time: "now"
      max_retries: 5
      retry_delay: 3
    indicators:
      RSI:
        - parameters: { timeperiod: 14 }
          aliases: { rsi: "ind_RSI_14" }
    patterns:
      CDLENGULFING:
        - parameters: {}
          aliases: { integer: "pat_ENGULFING" }
    strategy:
      take_profit: 1.0
      stop_loss: 0.5
      long:
        rule: AND
        conditions:
          - left: ind_RSI_14
            operator: "<"
            right: 35
            persist_bars: 0
      short:
        rule: AND
        conditions:
          - left: ind_RSI_14
            operator: ">"
            right: 65
            persist_bars: 0

  # 2. BTC 15m EMA Trend Crossover
  - strategy_name: "BTC 15m EMA Trend Crossover"
    market:
      exchange: "bybit"
      symbol: "BTC"
      timeframe: "1m"
      target_timeframe: "15m"
      start_time: "2026-07-19 00:00:00"
      end_time: "now"
      max_retries: 5
      retry_delay: 3
    indicators:
      EMA:
        - parameters: { timeperiod: 20 }
          aliases: { ema: "ind_EMA_20" }
        - parameters: { timeperiod: 50 }
          aliases: { ema: "ind_EMA_50" }
    patterns:
      CDLDOJI:
        - parameters: {}
          aliases: { integer: "pat_DOJI" }
    strategy:
      take_profit: 1.2
      stop_loss: 0.6
      long:
        rule: AND
        conditions:
          - left: ind_EMA_20
            operator: "cross_above"
            right: ind_EMA_50
            persist_bars: 0
      short:
        rule: AND
        conditions:
          - left: ind_EMA_20
            operator: "cross_below"
            right: ind_EMA_50
            persist_bars: 0

