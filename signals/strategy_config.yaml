# # ==========================================
# # INDICATOR CONFIGURATION
# # Defines which indicators to calculate and what aliases to give their columns
# # ==========================================
# indicators:
#   EMA:
#     # 20-period Exponential Moving Average
#     - parameters:
#         timeperiod: 20
#       aliases:
#         ema: "ind_EMA_20"
        
#     # 50-period Exponential Moving Average
#     - parameters:
#         timeperiod: 50
#       aliases:
#         ema: "ind_EMA_50"

#   RSI:
#     # 14-period Relative Strength Index
#     - parameters:
#         timeperiod: 14
#       aliases:
#         rsi: "ind_RSI_14"

#   MACD:
#     # Moving Average Convergence Divergence
#     - parameters:
#         fastperiod: 12
#         slowperiod: 26
#         signalperiod: 9
#       aliases:
#         macd: "ind_MACD_12_26_9"
#         macdsignal: "ind_MACD_SIGNAL_12_26_9"
#         macdhist: "ind_MACD_HIST_12_26_9"

# # ==========================================
# # PATTERN CONFIGURATION
# # Defines which candlestick patterns to look for
# # ==========================================
# patterns:
#   # Examples of TA-Lib pattern recognition functions
#   CDLDOJI:
#     - parameters: {}
#       aliases:
#         integer: "pat_DOJI"
#   CDLENGULFING:
#     - parameters: {}
#       aliases:
#         integer: "pat_BULLISH_ENGULFING" # Normally engulfing returns 100 for bullish, -100 for bearish

# # ==========================================
# # STRATEGY CONFIGURATION
# # Defines the trading rules based on the aliases defined above
# # ==========================================
# strategy:
#   long:
#     rule: "AND" # All conditions below must be true to trigger a LONG signal
#     conditions:
#       # Condition 1: Fast EMA crosses above Slow EMA
#       - left: "ind_EMA_20"
#         operator: "cross_above"
#         right: "ind_EMA_50"
#         persist_bars: 5 # Signal stays valid for 5 bars
        
#       # Condition 2: RSI is oversold (below 30)
#       - left: "ind_RSI_14"
#         operator: "<"
#         right: 30
#         persist_bars: 1
        
#       # Condition 3: MACD crosses above Signal line
#       - left: "ind_MACD_12_26_9"
#         operator: "cross_above"
#         right: "ind_MACD_SIGNAL_12_26_9"
#         persist_bars: 5

#   short:
#     rule: "AND" # All conditions below must be true to trigger a SHORT signal
#     conditions:
#       # Condition 1: Fast EMA crosses below Slow EMA
#       - left: "ind_EMA_20"
#         operator: "cross_below"
#         right: "ind_EMA_50"
#         persist_bars: 5
        
#       # Condition 2: RSI is overbought (above 70)
#       - left: "ind_RSI_14"
#         operator: ">"
#         right: 70
#         persist_bars: 1
        
#       # Condition 3: MACD crosses below Signal line
#       - left: "ind_MACD_12_26_9"
#         operator: "cross_below"
#         right: "ind_MACD_SIGNAL_12_26_9"
#         persist_bars: 5


indicators:
  SMA:
    - parameters:
        timeperiod: 20
      aliases:
        sma: "ind_sma_20"

strategy:
  long:
    rule: AND
    conditions:
      - left: ind_sma_20
        operator: cross_above
        right: close
        persist_bars: 0

  short:
    rule: AND
    conditions:
      - left: ind_sma_20
        operator: cross_below
        right: close
        persist_bars: 0

# ==========================================
# MARKET CONFIGURATION
# Defines the exchange, symbol, timeframe, and data range to run signals on
# ==========================================
market:
  # The exchange from which the data will be fetched (e.g., "binance", "bybit")
  exchange: "binance"
  # The crypto asset symbol to evaluate signals on
  symbol: "BTC"
  # The base database timeframe (must always be 1m)
  timeframe: "1m"
  # The target timeframe to resample the 1m data to (e.g., "1m", "5m", "15m", "1h", "4h")
  target_timeframe: "1h"
  # The starting date/time for the historical data range in UTC (YYYY-MM-DD HH:MM:SS)
  start_time: "2026-04-02 00:00:00"
  # The ending date/time for the historical data range ("now" or YYYY-MM-DD HH:MM:SS)
  end_time: "2026-06-02"
  # Maximum network request retries if exchange API calls fail
  max_retries: 5
  # Delay in seconds between retries
  retry_delay: 3