#   short:
#     rule: AND
#     conditions:
#       - left: ind_sma_20
#         operator: cross_below
#         right: close
#         persist_bars: 0
indicators:
  BBANDS:
    - parameters:
        timeperiod: 20
        nbdevup: 2.0
        nbdevdn: 2.0
      aliases:
        upper_band: "ind_bb_upper"
        middle_band: "ind_bb_middle"
        lower_band: "ind_bb_lower"

strategy:
  # Strategy Exit Settings
  take_profit: 4    # 4% Take Profit
  stop_loss: 2      # 2% Stop Loss

  long: 
    rule: AND
    conditions:
      # Trigger BUY when price drops below the lower band (oversold / bounce expected)
      - left: close
        operator: "cross_below"
        right: ind_bb_lower
        persist_bars: 0

  short:
    rule: AND
    conditions:
      # Trigger SHORT when price pumps above the upper band (overbought / rejection expected)
      - left: close
        operator: "cross_above"
        right: ind_bb_upper
        persist_bars: 0
  

# ==========================================
# MARKET CONFIGURATION
# Defines the exchange, symbol, timeframe, and data range to run signals on
# ==========================================
market:
  # The exchange from which the data will be fetched (e.g., "binance", "bybit")
  exchange: "bybit"
  # The crypto asset symbol to evaluate signals on
  symbol: "BTC"
  # The base database timeframe (must always be 1m)
  timeframe: "5m"
  # The target timeframe to resample the 1m data to (e.g., "1m", "5m", "15m", "1h", "4h")
  target_timeframe: "1h"
  # The starting date/time for the historical data range in UTC (YYYY-MM-DD HH:MM:SS)
  start_time: "2026-07-19 00:00:00"
  # The ending date/time for the historical data range ("now" or YYYY-MM-DD HH:MM:SS)
  end_time: "now"
  # Maximum network request retries if exchange API calls fail
  max_retries: 5
  # Delay in seconds between retries
  retry_delay: 3