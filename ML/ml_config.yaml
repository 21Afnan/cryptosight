# ==============================================================================
# CRYPTOSIGHT ML MODULE — DATASET CONFIGURATION
# ==============================================================================
# Single configuration file for Regression, Classification, and Time Series.
# Enable/disable sections independently (`enabled: true/false`) to customize datasets.
# ==============================================================================

model_type: classification  # Options: regression | classification | timeseries

# --- 1. MARKET DATA (Base OHLCV Dataset) ---
data:
  enabled: true  
  symbols:
    - "BTC"
  exchange: "binance"         # Options: "binance", "bybit", or a list like ["binance", "bybit"]
  timeframe: "1m"             # Base timeframe or target timeframe (if target_timeframe is not specified)
  target_timeframe: "15m"      # Resampled timeframe for feature engineering & ML training (e.g. "15m", "1h", "4h")
  start_date: "2025-01-01"
  end_date: "2026-06-30"
  fill_method: "ffill"        
  max_retries: 5
  retry_delay: 3

# --- 2. FEATURE ENGINEERING (Technical Indicators & Chart Patterns) ---
features:
  enabled: true
  indicators:
    EMA:
      - parameters:
          timeperiod: 20
        aliases:
          ema: ind_EMA_20
      - parameters:
          timeperiod: 50
        aliases:
          ema: ind_EMA_50
    RSI:
      - parameters:
          timeperiod: 14
        aliases:
          rsi: ind_RSI_14
    MACD:
      - parameters:
          fastperiod: 12
          slowperiod: 26
          signalperiod: 9
        aliases:
          macd: ind_MACD_12_26_9
          signal: ind_MACD_SIGNAL_12_26_9
          histogram: ind_MACD_HIST_12_26_9

  patterns:
    DOJI:
      aliases:
        pattern: pat_DOJI
    BULLISH_ENGULFING:
      aliases:
        pattern: pat_BULLISH_ENGULFING

# --- 4. PREDICTION TARGET GENERATION ---
target:
  source: close
  horizon: 1              # Number of bars ahead to predict (e.g. 1 bar = 15m into future if target_timeframe is 15m)
  threshold: 0.002        # For classification: minimum percentage return (0.2%) required to trigger Buy (1) or Sell (-1) above trading fees
# --- 5. DATA SPLITTING CONFIGURATION ---
splitting:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

# --- 6. TRADITIONAL ML CLASSIFICATION MODELS ---
classification:
  models:
    - name: logistic_regression
      parameters:
        class_weight: "balanced"
        max_iter: 1000
    - name: decision_tree
      parameters:
        class_weight: "balanced"
        max_depth: 5
    - name: random_forest
      parameters:
        class_weight: "balanced"
        n_estimators: 100
        max_depth: 5
    - name: lightgbm
      parameters:
        class_weight: "balanced"
        n_estimators: 100
        learning_rate: 0.05
        verbosity: -1
    - name: xgboost
      parameters:
        n_estimators: 100
        max_depth: 5
    - name: svm
      parameters:
        class_weight: "balanced"
        C: 1.0
        probability: true


# --- 7. INFERENCE CONFIGURATION ---
# Everything else (data, features, target) is inherited from above.
# This block only controls WHAT models to run and WHEN to run inference.
inference:
  model_type: "classification"   # Must match the trained model type above
  models:
    - "xgboost"
    - "random_forest"
    - "lightgbm"

  # Date range to run inference on (independent of training dates)
  start_date: "2026-07-01 00:00:00"
  end_date: "2026-07-16 00:00:00"
